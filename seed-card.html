<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box} body{width:1200px;height:630px;overflow:hidden}
.card{width:1200px;height:630px;position:relative;background:#0D0F12;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;padding:0 72px}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(76,141,255,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(76,141,255,0.045) 1px,transparent 1px);background-size:48px 48px}
.glow{position:absolute;top:-260px;right:-180px;width:680px;height:680px;background:radial-gradient(circle,rgba(21,94,239,0.22) 0%,rgba(21,94,239,0) 68%)}
.content{position:relative;width:640px}
.eyebrow{display:inline-block;color:#4C8DFF;font-size:20px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:22px}
.rule{width:64px;height:5px;border-radius:3px;margin-bottom:26px;background:linear-gradient(90deg,#155EEF,#4C8DFF)}
h1{color:#F5F7FA;font-size:52px;font-weight:750;line-height:1.12;letter-spacing:-1px;max-width:620px}
.motif{position:absolute;right:64px;top:50%;transform:translateY(-50%);width:300px;height:200px}
.panel{position:absolute;right:44px;top:50%;transform:translateY(-50%);width:340px;height:280px;background:#14171C;border:1px solid #232830;border-radius:16px}
.footer{position:absolute;bottom:44px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;color:#9AA3AF;font-size:21px}
.footer .author{font-weight:600;color:#C9CED6}.footer .badge{border:1px solid #2A2E35;border-radius:999px;padding:8px 20px;font-size:19px}
</style></head><body><div class="card">
<div class="grid"></div><div class="glow"></div>
<div class="content"><span class="eyebrow">B2B GTM Strategy</span><div class="rule"></div><h1>Building a Territory-Based GTM Model for Small B2B Teams</h1></div>
<div class="panel"></div><svg class="motif" viewBox="0 0 300 200"><g stroke="#4C8DFF" stroke-width="3" fill="none" opacity="0.45"><path d="M20 30 H90 L120 70 H150"/><path d="M20 70 H100 L130 110 H150"/><path d="M20 110 H90 L120 150 H150"/><rect x="150" y="66" width="34" height="88" rx="6"/></g><g stroke="#155EEF" stroke-width="3.5" fill="none" stroke-linecap="round"><path d="M30 170 C 90 176, 150 176, 230 170 L230 150"/></g><circle cx="244" cy="150" r="12" fill="#4C8DFF"/></svg>
<div class="footer"><span class="author">Subhasish Adhikary</span><span class="badge">subhasishadhikary.com</span></div>
</div></body></html>
